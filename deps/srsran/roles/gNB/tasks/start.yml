---

- name: check if servers and config server length are equal
  fail:
    msg: "Mismatch in number of servers and srsran nodes: {{ srsran.servers|length }} vs {{ groups['srsran_nodes']|length }}"
  when: srsran.servers|length != groups['srsran_nodes']|length

- name: Preflight | Docker CPU availability for srsRAN gNB
  ansible.builtin.include_role:
    name: preflight
    tasks_from: docker_cpu
  vars:
    preflight_label: "srsRAN gNB"
    preflight_min_cpus: "{{ srsran.docker.preflight.min_cpus }}"
    preflight_probe_image: "{{ srsran.docker.preflight.probe_image }}"
    preflight_enabled: "{{ srsran.docker.preflight.enabled }}"
  when: inventory_hostname in groups['srsran_nodes']

# prep Ubuntu to support srsRAN gNB in DPDK-mode
- name: set net.core.wmem_max to 24912805
  ansible.posix.sysctl:
    name: net.core.wmem_max
    value: '24912805'
    sysctl_set: true
    reload: true
  when: inventory_hostname in groups['srsran_nodes']
  become: true

- name: set net.core.rmem_max to 24912805
  ansible.posix.sysctl:
    name: net.core.rmem_max
    value: '24912805'
    sysctl_set: true
    reload: true
  when: inventory_hostname in groups['srsran_nodes']
  become: true

- name: ensure {{ srsran.docker.container.gnb_image }} image is present
  # `source: local` reuses the image staged into Docker by the
  # bundle's dockerimages step. Online installs still pull.
  community.docker.docker_image:
    name: "{{ srsran.docker.container.gnb_image }}"
    source: "{{ 'local' if airgapped.enabled | default(false) | bool else 'pull' }}"
  when: inventory_hostname in groups['srsran_nodes']
  become: true

# Rendered configs live under /var/lib so they survive a reboot. /tmp is a
# tmpfs on many hosts and is cleared by systemd-tmpfiles after 10 days on the
# rest; a container with restart_policy: unless-stopped then restarts with
# Docker having created an empty directory where its config file should be,
# and the gNB fails to parse it in a loop. /var/lib is also root-owned rather
# than world-writable 1777, so a privileged container no longer takes its
# configuration from a directory every local user can write to. Under the old
# layout that was safe only by virtue of /tmp's sticky bit and the template
# module's default of not following symlinks, neither of which this role
# states as a requirement. The render also sets an explicit root:root 0644
# instead of leaving the mode to the remote user's umask.
- name: create srsRAN runtime directories
  file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: /var/lib/srsran, mode: '0755' }
    - { path: /var/lib/srsran/conf, mode: '0755' }
    - { path: /var/lib/srsran/pcap, mode: '0750' }
  when: inventory_hostname in groups['srsran_nodes']
  become: true

- name: render gNB config to /var/lib/srsran/conf/gnb_config.yaml
  template:
    src: "{{ ROOT_DIR }}/{{ srsran.servers[server_index | int].gnb_conf }}"
    dest: /var/lib/srsran/conf/gnb_config.yaml
    owner: root
    group: root
    mode: '0644'
  register: srsran_gnb_config
  vars:
    server_index: "{{ groups['srsran_nodes'].index(inventory_hostname) }}"
    gnb_ip: "{{ srsran.servers[server_index | int].gnb_ip }}"
    gnb_id: "{{ (groups['srsran_nodes'].index(inventory_hostname) | int) + 1000 }}"
  when: inventory_hostname in groups['srsran_nodes']
  become: true

- name: create {{ srsran.docker.container.gnb_image }} containers
  community.docker.docker_container:
    name: "srsran-gnb"
    image: "{{ srsran.docker.container.gnb_image }}"
    networks:
      - name: "{{ srsran.docker.network.name }}"
    volumes:
      # the config directory, read-only: srsRAN only ever reads it, and a
      # directory mount keeps a missing file reporting as a missing file
      - /var/lib/srsran/conf:/etc/srsran:ro
      - /var/lib/srsran/pcap:/var/log/srsran
      - /dev/hugepages:/dev/hugepages
    devices:
      - /dev/vfio:/dev/vfio
    privileged: true
    # A re-render does not reach an already running container, and the
    # module leaves an otherwise unchanged container alone, so bounce it
    # exactly when the rendered config changed.
    restart: "{{ srsran_gnb_config is changed }}"
    restart_policy: unless-stopped
    state: started
    detach: true
    command: "gnb -c /etc/srsran/gnb_config.yaml"
  when: inventory_hostname in groups['srsran_nodes']
  become: true
