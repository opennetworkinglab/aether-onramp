---

# The UPF's subnets and gateways come from the shared resolver (see
# deps/common/roles/preflight/tasks/upf_networks.yml) so this role and the
# 5gc roles read one description of the UPF's networking.
- name: resolve UPF networking
  import_role:
    name: preflight
    tasks_from: upf_networks.yml
  vars:
    upf_networks_strict: false

- name: check if servers and config server length are equal
  fail:
    msg: "Mismatch in number of servers and oai nodes: {{ oai.servers|length }} vs {{ groups['oai_nodes']|length }}"
  when: oai.servers|length != groups['oai_nodes']|length

- name: check if simluation is enabled else abort
  fail:
    msg: "Simulation is not enabled"
  when: oai.simulation == false

- name: ensure {{ oai.docker.container.ue_image }} image is present
  # `source: local` reuses the image staged into Docker by the
  # bundle's dockerimages step. Online installs still pull.
  community.docker.docker_image:
    name: "{{ oai.docker.container.ue_image }}"
    source: "{{ 'local' if airgapped.enabled | default(false) | bool else 'pull' }}"
  when: inventory_hostname in groups['oai_nodes']
  become: true

# Rendered configs live under /var/lib so they survive a reboot. /tmp is a
# tmpfs on many hosts and is cleared by systemd-tmpfiles after 10 days on the
# rest; a container with restart_policy: unless-stopped then restarts with
# Docker having created an empty directory where its config file should be,
# cannot read its config, and ends up stopped. Measured on a rebooted VM: the
# container is `exited` with RestartCount 0 and stays there, and recovering
# needs a re-run of the role. /var/lib is also root-owned rather
# than world-writable 1777, so a privileged container no longer takes its
# configuration from a directory every local user can write to. Under the old
# layout that was safe only by virtue of /tmp's sticky bit and the template
# module's default of not following symlinks, neither of which this role
# states as a requirement. The render also sets an explicit root:root 0644
# instead of leaving the mode to the remote user's umask.
- name: create OAI runtime directories
  file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: /var/lib/oai, mode: '0755' }
    - { path: /var/lib/oai/conf, mode: '0755' }
  when: inventory_hostname in groups['oai_nodes']
  become: true

- name: render UE config to /var/lib/oai/conf/nr-ue.conf
  template:
    src: "{{ ROOT_DIR }}/{{ oai.servers[server_index | int].ue_conf }}"
    dest: /var/lib/oai/conf/nr-ue.conf
    owner: root
    group: root
    # the UE config carries milenage key material (k, opc) and the IMSI
    mode: '0600'
  register: oai_ue_config
  vars:
    server_index: "{{ groups['oai_nodes'].index(inventory_hostname) }}"
  when: inventory_hostname in groups['oai_nodes']
  become: true

- name: create {{ oai.docker.container.ue_image }} containers
  community.docker.docker_container:
    name: "rfsim5g-oai-nr-ue"
    image: "{{ oai.docker.container.ue_image }}"
    networks:
      - name: "{{ oai.docker.network.name }}"
    env:
      USE_ADDITIONAL_OPTIONS: "-r 106 --numerology 1 --band 78 -C 3619200000  --rfsim --ssb 516 --rfsimulator.serveraddr {{ gnb_ip }}"
    volumes:
      # OAI's entrypoint rewrites this file in place, so it stays a writable
      # single-file mount at the path the image expects
      - /var/lib/oai/conf/nr-ue.conf:/opt/oai-nr-ue/etc/nr-ue.conf
    devices:
      - /dev/net/tun:/dev/net/tun
    privileged: true
    capabilities:
    - NET_ADMIN
    - NET_RAW
    # A re-render does not reach an already running container, and the
    # module leaves an otherwise unchanged container alone, so bounce it
    # exactly when the rendered config changed.
    restart: "{{ oai_ue_config.changed | default(false) }}"
    restart_policy: unless-stopped
    state: started
    detach: true
  vars:
    server_index: "{{ groups['oai_nodes'].index(inventory_hostname) }}"
    gnb_ip: "{{ oai.servers[server_index | int].gnb_ip }}"
  when: inventory_hostname in groups['oai_nodes']
  become: true

- pause:
    seconds: 10

- set_fact:
    ping_target: "{{ upf_instances.default.core.gateway }}"
  when: inventory_hostname in groups['oai_nodes']

- name: run ping command to check if the UE is running and show output
  community.docker.docker_container_exec:
    container: rfsim5g-oai-nr-ue
    command: "ping -I oaitun_ue1 -c 5 {{ ping_target }}"
  register: uEsimPingOutput
  when: inventory_hostname in groups['oai_nodes']
  become: true

- debug:
    var: uEsimPingOutput.stdout_lines
  when: inventory_hostname in groups['oai_nodes']
