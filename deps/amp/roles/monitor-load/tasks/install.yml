---

- name: install kubernetes.core python prerequisite for amp/monitor-load
  import_role:
    name: preflight
    tasks_from: python_kubernetes.yml

- name: verify kubeconfig prerequisites for amp/monitor-load
  import_role:
    name: preflight
    tasks_from: kubeconfig.yml
  vars:
    kubeconfig_component_name: AMP monitor-load
    kubeconfig_help_text: >-
      Run the k8s provisioning flow first, or set kubeconfig_source and rerun
      the install path that bootstraps it.

- name: Create a k8s "aether-5gc" namespace
  kubernetes.core.k8s:
    name: aether-5gc
    kind: Namespace
    state: present
  when: inventory_hostname in groups['master_nodes']
  ignore_errors: yes

- name: Create a k8s "cattle-dashboards" namespace
  kubernetes.core.k8s:
    name: cattle-dashboards
    kind: Namespace
    state: present
  when: inventory_hostname in groups['master_nodes']
  ignore_errors: yes

- name: Copy monitoring content in /tmp/monitoring to remote host
  copy:
    src:  "{{ ROOT_DIR }}/{{ amp.monitor_dashboard }}/"
    dest: /tmp/monitoring/
  when: inventory_hostname in groups['master_nodes']

- name: apply monitoring dashboard
  command:
    argv:
      - kubectl
      - apply
      - -k
      - /tmp/monitoring
  when: inventory_hostname in groups['master_nodes']
  ignore_errors: yes

- name: remove /tmp/monitoring
  file:
    path: "/tmp/monitoring"
    state: absent
  when: inventory_hostname in groups['master_nodes']
