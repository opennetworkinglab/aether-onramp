---

- name: verify helm prerequisites for amp/monitor uninstall
  import_role:
    name: preflight
    tasks_from: helm.yml

- name: verify kubeconfig prerequisites for amp/monitor uninstall
  import_role:
    name: preflight
    tasks_from: kubeconfig.yml
  vars:
    kubeconfig_component_name: AMP monitor
    kubeconfig_help_text: >-
      Run the k8s provisioning flow first, or set kubeconfig_source and rerun
      the install path that bootstraps it.

- name: remove rancher-monitoring from cattle-monitoring-system
  kubernetes.core.helm:
    name: rancher-monitoring
    release_namespace: cattle-monitoring-system
    state: absent
    wait: true
  when: inventory_hostname in groups['master_nodes']
  ignore_errors: yes

- name: remove rancher-monitoring-crd from cattle-monitoring-system
  kubernetes.core.helm:
    name: rancher-monitoring-crd
    release_namespace: cattle-monitoring-system
    state: absent
    wait: true
  when: inventory_hostname in groups['master_nodes']
  ignore_errors: yes

- name: delete namespace cattle-dashboards cattle-monitoring-system
  command:
    argv:
      - kubectl
      - delete
      - namespace
      - cattle-dashboards
      - cattle-monitoring-system
  when: inventory_hostname in groups['master_nodes']
  ignore_errors: yes

- name: remove /tmp/monitor-values.yaml
  file:
    path: "/tmp/monitor-values.yaml"
    state: absent
  when: inventory_hostname in groups['master_nodes']
  ignore_errors: yes
