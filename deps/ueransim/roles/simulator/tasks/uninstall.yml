---

# The UPF's subnets and gateways come from the shared resolver (see
# deps/common/roles/preflight/tasks/upf_networks.yml) so this role and the
# 5gc roles read one description of the UPF's networking.
- name: resolve UPF networking
  import_role:
    name: preflight
    tasks_from: upf_networks.yml
  vars:
    upf_networks_strict: false

- name: remove UERANSIM container
  community.docker.docker_container:
    name: "{{ ueransim.docker.container.name }}"
    state: absent
  ignore_errors: yes
  become: true
  when: inventory_hostname in groups['ueransim_nodes']

- name: remove UERANSIM config directory
  file:
    path: /tmp/ueransim
    state: absent
  ignore_errors: yes
  become: true
  when: inventory_hostname in groups['ueransim_nodes']

- name: notice | preserve {{ ueransim.docker.container.image }} in airgap mode
  debug:
    msg: |
      Skipping image purge of '{{ ueransim.docker.container.image }}' to
      preserve the airgap install cache. Reinstalling without the
      cached image would require network access. Re-run with
      `-e airgapped.allow_purge=true` to remove the image as well.
  when:
    - inventory_hostname in groups['ueransim_nodes']
    - airgapped.enabled | default(false) | bool
    - not (airgapped.allow_purge | default(false) | bool)

- name: remove {{ ueransim.docker.container.image }} image
  community.docker.docker_image:
    name: "{{ ueransim.docker.container.image }}"
    state: absent
    force_absent: true
  ignore_errors: yes
  become: true
  when:
    - inventory_hostname in groups['ueransim_nodes']
    - not (airgapped.enabled | default(false) | bool) or (airgapped.allow_purge | default(false) | bool)

- set_fact:
    subnet: "{{ upf_instances.default.access.subnet }}"
  when: inventory_hostname in groups['ueransim_nodes']

- name: remove static route for upf traffic on ueransim node
  command:
    argv:
      - ip
      - route
      - del
      - "{{ subnet }}"
      - via
      - "{{ core.amf.ip }}"
  when: (inventory_hostname in groups['ueransim_nodes']) and (inventory_hostname not in groups['master_nodes']) and upf_instances.default.access.host_gateway
  become: true
  ignore_errors: yes
