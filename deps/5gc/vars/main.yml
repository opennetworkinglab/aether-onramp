# Airgap behaviour for `apt: update_cache` tasks. See vars/main.yml
# for full documentation.
airgapped:
  enabled: false                 # set true to skip `apt update_cache` (offline / mirror-only sites)

core:
  values_file: "roles/core/templates/sdcore-5g-values.yaml"

  # UPF networking is described by core.networks and core.upf.instances in
  # the top-level vars/main.yml; both are optional and default to the
  # collapsed single-interface deployment. See README.md. Nothing is set
  # here because this file is merged into every 5gc play.

  helm:
    local_charts: false
    chart_ref: oci://ghcr.io/omec-project/sd-core
    chart_version: 6.1.0 # Ignored if using local charts (local_charts: true)

  upf:
    mode: af_packet      # Options: af_packet or dpdk
