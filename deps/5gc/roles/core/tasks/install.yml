---

# Interpret core.networks and core.upf.instances and check them against this
# host before anything is installed. The router and additional-UPF roles
# import the same task file, so all three read one resolved description of
# the UPF's networking and fail with the same messages.
- name: resolve UPF networking
  import_role:
    name: preflight
    tasks_from: upf_networks.yml

# kubernetes.core modules (helm, k8s, k8s_info, etc.) require the python
# `kubernetes` client library, which is NOT pulled in by a stock apt
# install of ansible on Ubuntu. Install it up-front so later tasks in
# this role don't fail with "Failed to import the required Python
# library (kubernetes)".
- name: install kubernetes.core python prerequisite for 5gc/core
  import_role:
    name: preflight
    tasks_from: python_kubernetes.yml

# Ensure ~/.kube/config exists for the ansible user so kubernetes.core
# tasks below find a valid config. The k8s role populates this on its
# own install path (see deps/k8s/roles/rke2/tasks/install.yml) — and
# also rewrites the server URL from 127.0.0.1 to the master's
# ansible_host, which matters on multi-node. We must not clobber that
# post-processing.
#
# Strategy: only act when ~/.kube/config is missing. When the k8s
# role has already run (full onramp flow) the file exists and the
# whole block is a no-op. When operators bring a pre-existing
# cluster and skip the k8s role, the file is absent and we probe
# /etc/rancher/{rke2,k3s}/*.yaml for a source to copy from.
#
# Operators can set `kubeconfig_source` in inventory vars to skip the
# probe; to force-reinstall, delete ~/.kube/config first.
- name: bootstrap and verify kubeconfig for 5gc/core install
  import_role:
    name: preflight
    tasks_from: bootstrap_kubeconfig.yml
  vars:
    kubeconfig_component_name: 5GC core install
    kubeconfig_help_text: >-
      Run the k8s provisioning flow first, or set kubeconfig_source to a valid
      cluster kubeconfig path on the target host.

# Validate SR-IOV UPF resource pools and VF MAC addresses for the built-in
# UPF. Shared with the additional-UPF install path (5gc/upf) via the
# preflight role so both paths accept identical configuration and cannot
# drift. The task file checks each PF a dpdk UPF attaches through, and does
# nothing when no UPF is in dpdk mode.
- name: validate SR-IOV UPF resource pools for built-in UPF
  import_role:
    name: preflight
    tasks_from: sriov_upf_pools.yml

- name: remove /tmp/sdcore-5g-values.yaml
  file:
    path: "/tmp/sdcore-5g-values.yaml"
    state: absent
  when: inventory_hostname in groups['master_nodes']

- name: copy {{ core.values_file }} to /tmp/sdcore-5g-values.yaml
  template:
    src: "{{ ROOT_DIR }}/{{ core.values_file }}"
    dest: "/tmp/sdcore-5g-values.yaml"
  vars:
    upf: "{{ upf_instances.default }}"
  when: inventory_hostname in groups['master_nodes']

- set_fact:
    local_sd_core_chart_root: "{{ core.helm.chart_ref | regex_replace('^(.*)/.*$', '\\1')  }}"
    local_sd_core_chart_path: "/tmp/sdcore-helm-charts/{{ core.helm.chart_ref | regex_replace('^.*/(.*)$', '\\1') }}"
  when: inventory_hostname in groups['master_nodes'] and core.helm.local_charts

- debug:
    var: local_sd_core_chart_root
  when: inventory_hostname in groups['master_nodes'] and core.helm.local_charts

- set_fact:
    core_helm_requires_repo_update: "{{ (not core.helm.local_charts) and not (core.helm.chart_ref is match('^oci://')) }}"
  when: inventory_hostname in groups['master_nodes']

- name: copy local_charts to /tmp/sdcore-helm-charts
  # ansible.builtin.copy cannot exclude paths during recursive directory
  # copies, so package the chart tree on the controller while omitting the
  # local git metadata and then unarchive it on the target via the normal
  # Ansible transport. This preserves ansible_user ownership on the remote
  # host and avoids spending time traversing .git.
  block:
    - name: create local archive path for sd-core charts
      ansible.builtin.tempfile:
        state: file
        suffix: .tar.gz
      register: core_local_chart_archive
      delegate_to: localhost
      become: false
      run_once: true

    - name: archive local_charts without git metadata
      ansible.builtin.archive:
        path: "{{ local_sd_core_chart_root }}/"
        dest: "{{ core_local_chart_archive.path }}"
        format: gz
        exclude_path:
          - "{{ local_sd_core_chart_root }}/.git"
      delegate_to: localhost
      become: false
      run_once: true

    - name: publish local sd-core charts archive path
      ansible.builtin.set_fact:
        core_local_chart_archive_path: "{{ core_local_chart_archive.path }}"
      delegate_to: localhost
      delegate_facts: true
      become: false
      run_once: true

    - name: remove remote sd-core chart staging directory
      ansible.builtin.file:
        path: /tmp/sdcore-helm-charts
        state: absent

    - name: create remote sd-core chart staging directory
      ansible.builtin.file:
        path: /tmp/sdcore-helm-charts
        state: directory
        mode: "0755"

    - name: unpack local_charts to /tmp/sdcore-helm-charts
      ansible.builtin.unarchive:
        src: "{{ hostvars['localhost'].core_local_chart_archive_path }}"
        dest: /tmp/sdcore-helm-charts/

  always:
    - name: remove local sd-core charts archive
      ansible.builtin.file:
        path: "{{ core_local_chart_archive.path }}"
        state: absent
      delegate_to: localhost
      become: false
      run_once: true
      when:
        - core_local_chart_archive is defined
        - core_local_chart_archive.path is defined
  when: inventory_hostname in groups['master_nodes'] and core.helm.local_charts

- debug:
    var: local_sd_core_chart_path
  when: inventory_hostname in groups['master_nodes'] and core.helm.local_charts

- name: update aether 5gc helm dependencies
  command:
    argv:
      - helm
      - dep
      - up
      - "{{ local_sd_core_chart_path }}"
  when: inventory_hostname in groups['master_nodes'] and core.helm.local_charts

# The mongodb-kubernetes operator's MongoDBCommunity StatefulSet requests a
# PersistentVolumeClaim per member, and relies on the cluster having a
# default StorageClass to dynamically provision them (the chart's generated
# manifest sets no storageClassName). onramp/deps/k8s (RKE2) does not ship
# one, unlike k3s, so without this the PVCs stay Pending and the mongodb-0
# pod never schedules ("pod has unbound immediate PersistentVolumeClaims").
# Mirrors deps/sdran/roles/platform's local-path-provisioner install; skipped
# when some other default StorageClass is already present so we don't end up
# with two StorageClasses both annotated as default.
- name: check for an existing default StorageClass
  kubernetes.core.k8s_info:
    api_version: storage.k8s.io/v1
    kind: StorageClass
  register: core_storage_classes
  when:
    - inventory_hostname in groups['master_nodes']
    - not (airgapped.enabled | default(false) | bool)

- name: set fact for presence of a default StorageClass
  set_fact:
    core_has_default_storage_class: >-
      {%- set found = [] -%}
      {%- for sc in core_storage_classes.resources | default([]) -%}
      {%-   if (sc.metadata.annotations | default({})).get('storageclass.kubernetes.io/is-default-class', 'false') == 'true' -%}
      {%-     set _ = found.append(1) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ (found | length > 0) | bool }}
  when:
    - inventory_hostname in groups['master_nodes']
    - not (airgapped.enabled | default(false) | bool)

- name: apply local-path-provisioner manifest for mongodb-kubernetes PVCs
  command:
    argv:
      - kubectl
      - apply
      - -f
      - "https://raw.githubusercontent.com/rancher/local-path-provisioner/{{ core.get('mongodb', {}).get('operator', {}).get('lpp', {}).get('version', 'v0.0.24') }}/deploy/local-path-storage.yaml"
      - --wait=true
  when:
    - inventory_hostname in groups['master_nodes']
    - not (airgapped.enabled | default(false) | bool)
    - not core_has_default_storage_class

- name: patch local-path StorageClass as default
  command:
    argv:
      - kubectl
      - patch
      - storageclass
      - local-path
      - -p
      - '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
  when:
    - inventory_hostname in groups['master_nodes']
    - not (airgapped.enabled | default(false) | bool)
    - not core_has_default_storage_class

# The 5g-control-plane chart's mongodbCommunity path only renders a
# MongoDBCommunity custom resource; it expects the MongoDB Controllers for
# Kubernetes (MCK) operator already watching the release namespace, exactly
# as sdcore-helm-charts documents next to mongodbCommunity in
# 5g-control-plane/values.yaml. Without it, the helm install below fails with
# "no matches for kind MongoDBCommunity ... ensure CRDs are installed first".
- name: add mongodb helm repo
  kubernetes.core.helm_repository:
    name: mongodb
    repo_url: "https://mongodb.github.io/helm-charts"
  when:
    - inventory_hostname in groups['master_nodes']
    - not (airgapped.enabled | default(false) | bool)

- name: deploy mongodb-kubernetes operator and CRDs
  kubernetes.core.helm:
    update_repo_cache: true
    name: mongodb-kubernetes
    release_namespace: aether-5gc
    create_namespace: true
    chart_ref: "{{ core.get('mongodb', {}).get('operator', {}).get('helm', {}).get('chart_ref') | default('mongodb/mongodb-kubernetes', true) }}"
    chart_version: "{{ core.get('mongodb', {}).get('operator', {}).get('helm', {}).get('chart_version') | default(omit, true) }}"
    values:
      operator:
        watchNamespace: aether-5gc
    wait: true
    wait_timeout: "5m0s"
  when:
    - inventory_hostname in groups['master_nodes']
    - not (airgapped.enabled | default(false) | bool)

# Mirrors amp/monitor's airgap notice: this role has no offline bundle for
# the mongodb-kubernetes chart today, so the operator install is skipped
# rather than half-applied.
- name: notice | mongodb-kubernetes operator skipped in airgap mode
  ansible.builtin.debug:
    msg: |
      airgapped.enabled is true, so the mongodb-kubernetes operator/CRDs were
      not installed from https://mongodb.github.io/helm-charts. The sd-core
      deploy below will fail with "no matches for kind MongoDBCommunity" unless the
      operator and its CRDs are already present in the cluster (e.g.
      pre-loaded from an offline bundle).
  when:
    - inventory_hostname in groups['master_nodes']
    - airgapped.enabled | default(false) | bool

# The 5g-control-plane chart's kafkaStrimzi path only renders Kafka
# and KafkaNodePool custom resources; it expects the Strimzi operator already
# watching the release namespace. Without it, the helm install below fails
# with "no matches for kind Kafka ... ensure CRDs are installed first".
- name: add strimzi helm repo
  kubernetes.core.helm_repository:
    name: strimzi
    repo_url: "{{ core.get('kafka', {}).get('operator', {}).get('helm', {}).get('repo_url') | default('https://strimzi.io/charts/', true) }}"
  when:
    - inventory_hostname in groups['master_nodes']
    - not (airgapped.enabled | default(false) | bool)

# Helm installs a chart's crds/ only when the CRDs don't exist yet and never
# upgrades them, so CRDs left over from another operator version are reused as
# is. The 5g-control-plane chart renders kafka.strimzi.io/v1beta2, which
# operators >= 1.0 no longer serve; an older operator against v1-only CRDs
# crash-loops ("GET .../v1beta2/... Not Found"). Fail here, with the fix,
# instead of after the operator's 5m helm wait times out.
- name: look up existing strimzi Kafka CRD
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: kafkas.kafka.strimzi.io
  register: core_strimzi_kafka_crd
  when:
    - inventory_hostname in groups['master_nodes']
    - not (airgapped.enabled | default(false) | bool)

- name: fail when existing strimzi CRDs do not serve kafka.strimzi.io/v1beta2
  ansible.builtin.fail:
    msg: >-
      The cluster already has Strimzi CRDs that do not serve
      kafka.strimzi.io/v1beta2 (served versions:
      {{ core_strimzi_kafka_crd.resources[0].spec.versions | selectattr('served') | map(attribute='name') | list }}),
      which the sd-core 5g-control-plane chart needs. Helm does not replace
      existing CRDs. Run 'make aether-5gc-uninstall' (removes the Strimzi
      CRDs) or delete them with
      "kubectl get crd -o name | grep strimzi.io | xargs kubectl delete",
      then rerun the install.
  when:
    - inventory_hostname in groups['master_nodes']
    - not (airgapped.enabled | default(false) | bool)
    - core_strimzi_kafka_crd.resources | default([]) | length > 0
    - "'v1beta2' not in (core_strimzi_kafka_crd.resources[0].spec.versions | selectattr('served') | map(attribute='name') | list)"

- name: deploy strimzi kafka operator and CRDs
  kubernetes.core.helm:
    update_repo_cache: true
    name: strimzi-kafka-operator
    release_namespace: aether-5gc
    create_namespace: true
    chart_ref: "{{ core.get('kafka', {}).get('operator', {}).get('helm', {}).get('chart_ref') | default('strimzi/strimzi-kafka-operator', true) }}"
    chart_version: "{{ core.get('kafka', {}).get('operator', {}).get('helm', {}).get('chart_version') | default(omit, true) }}"
    # No watchNamespaces: the operator watches its release namespace
    # (aether-5gc) by default. Listing that same namespace explicitly makes
    # the chart render every RoleBinding twice, and the install fails with
    # "rolebindings ... already exists".
    wait: true
    wait_timeout: "5m0s"
  when:
    - inventory_hostname in groups['master_nodes']
    - not (airgapped.enabled | default(false) | bool)

- name: notice | strimzi kafka operator skipped in airgap mode
  ansible.builtin.debug:
    msg: |
      airgapped.enabled is true, so the Strimzi operator/CRDs were not
      installed from https://strimzi.io/charts/. The sd-core deploy below
      will fail with "no matches for kind Kafka" unless the operator and its
      CRDs are already present in the cluster (e.g. pre-loaded from an
      offline bundle).
  when:
    - inventory_hostname in groups['master_nodes']
    - airgapped.enabled | default(false) | bool

# TODO: add systems check to avoid issues (e.g., mongodb needing avx support)
- name: deploy aether 5gc
  block:
    # Render helm-diff server-side so `lookup` works on upgrade (Helm 3.13+).
    - name: deploy aether 5gc
      environment:
        HELM_DIFF_USE_UPGRADE_DRY_RUN: "true"
      kubernetes.core.helm:
        update_repo_cache: "{{ core_helm_requires_repo_update }}"
        name: sd-core
        release_namespace: aether-5gc
        create_namespace: true
        chart_ref: "{{ core.helm.chart_ref if core.helm.local_charts == false else local_sd_core_chart_path }}"
        chart_version: "{{ core.helm.chart_version if core.helm.local_charts == false else omit }}"
        values_files:
          - /tmp/sdcore-5g-values.yaml
        wait: true
        wait_timeout: "5m0s" # Increase wait timeout to allow for longer deployment times in systems with limited compute resources
        force: true
      when: inventory_hostname in groups['master_nodes']

  rescue:
    # Intentionally non-fatal: when helm failed because the cluster is
    # unreachable or kubeconfig is missing, k8s_info will hit the same
    # error. Letting it abort the rescue would mean the loud-fail task
    # below never runs and operators see the k8s_info error instead of
    # the underlying helm failure. failed_when: false registers
    # pod_status in both the "empty namespace" and "API unreachable"
    # cases; `pod_status.resources | default([])` below normalises
    # both to an empty list so the loud-fail fires.
    # label_selectors excludes app=ue: the gnbsim/UE-simulator pods that
    # can share this namespace are not part of the sd-core release and
    # must not be restarted or block this rescue's readiness checks
    # (see the same exclusion in roles/core/tasks/uninstall.yml).
    - name: Get Pods Status
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: aether-5gc
        label_selectors:
          - app!=ue
      register: pod_status
      changed_when: false
      failed_when: false
      when: inventory_hostname in groups['master_nodes']

    # The restart loop below can only recover from "pods were created but
    # some are not Ready". When pod_status.resources is empty the helm
    # deploy never produced any pods (typical when chart_ref is
    # unreachable, the cluster API is down, or kubeconfig is missing),
    # so there is nothing for the rescue to fix. Re-raise with the
    # original failure details so operators see the helm error directly
    # instead of hunting through earlier task output.
    # `pod_status.resources | length == 0` is true in two cases now
    # that k8s_info is non-fatal: the namespace genuinely has no
    # pods, OR k8s_info itself failed (cluster unreachable,
    # kubeconfig missing, RBAC denial). Both indicate "nothing to
    # recover" from this rescue's perspective; the surfaced
    # ansible_failed_result tells the operator which one.
    - name: fail loudly when helm deploy produced no pods to recover
      ansible.builtin.fail:
        msg: |-
          sd-core helm deploy failed and no pods were found in
          aether-5gc (the namespace is empty, or k8s_info could not
          query the cluster API) — nothing for the rescue to recover.

          Original failure in task '{{ ansible_failed_task.name | default('unknown', true) }}':
          {{ ansible_failed_result.msg | default('', true)
             | default(ansible_failed_result | default({}, true) | to_nice_yaml, true) }}
      when:
        - inventory_hostname in groups['master_nodes']
        - (pod_status.resources | default([])) | length == 0

    # A pod is only Ready when it reports phase Running, has a Ready
    # condition with status True, and is not being terminated — phase
    # alone can stay Running with an unready/terminating container.
    - name: restart Pods if not Ready
      kubernetes.core.k8s:
        api_version: v1
        kind: Pod
        namespace: aether-5gc
        name: "{{ item.metadata.name }}"
        state: absent
      loop: "{{ pod_status.resources | default([]) }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      register: pod_restart
      when:
        - inventory_hostname in groups['master_nodes']
        - (item.metadata.deletionTimestamp is not defined)
        - ((item.status.phase | default('')) != 'Running') or
          ((item.status.conditions | default([]) | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True') | list | length) == 0)
      ignore_errors: yes

    # Nothing recovered when no pod was restarted: re-raise the helm failure.
    - name: fail loudly when helm deploy failed and the rescue restarted no pods
      ansible.builtin.fail:
        msg: |-
          sd-core helm deploy failed and the rescue restarted no pods in
          aether-5gc (every pod was Ready, or the unready ones were already
          terminating or could not be deleted), so it recovered nothing.

          Original failure in task '{{ ansible_failed_task.name | default('unknown', true) }}':
          {{ ansible_failed_result.msg | default('', true)
             | default(ansible_failed_result | default({}, true) | to_nice_yaml, true) }}
      when:
        - inventory_hostname in groups['master_nodes']
        - (pod_restart.results | default([]) | selectattr('changed', 'defined') | selectattr('changed') | list | length) == 0

    # kubernetes.core.k8s_info's own wait/wait_condition retries the list
    # query (until it is non-empty) and then waits per-pod for the Ready
    # condition, up to wait_timeout — no need for a manual until/retries
    # loop or an extra collection dependency to express the Ready check.
    - name: wait for aether-5gc pods to be Ready after restart
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: aether-5gc
        label_selectors:
          - app!=ue
        wait: true
        wait_condition:
          type: Ready
          status: "True"
        wait_timeout: 300
        wait_sleep: 10
      register: pod_ready_status
      ignore_errors: yes
      when: inventory_hostname in groups['master_nodes']

    # The wait task above raises (and, via ignore_errors, only warns) as
    # soon as any single pod times out, without populating pod_ready_status
    # for the rest — re-query (no wait) so the checks below reflect the
    # actual current state of every pod for accurate diagnostics.
    - name: re-check aether-5gc pod status after wait
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: aether-5gc
        label_selectors:
          - app!=ue
      register: pod_final_status
      changed_when: false
      failed_when: false
      when: inventory_hostname in groups['master_nodes']

    - name: fail loudly when no aether-5gc pods were found after restart
      ansible.builtin.fail:
        msg: |-
          No pods were found in aether-5gc after the rescue block
          restarted them — the namespace is empty, or k8s_info could
          not query the cluster API.
      when:
        - inventory_hostname in groups['master_nodes']
        - (pod_final_status.resources | default([])) | length == 0

    - name: identify aether-5gc pods that are still not Ready
      ansible.builtin.set_fact:
        pod_still_not_ready_names: >-
          {{ (pod_still_not_ready_names | default([])) + ([item.metadata.name]
             if ((item.metadata.deletionTimestamp is defined) or
                 ((item.status.phase | default('')) != 'Running') or
                 ((item.status.conditions | default([]) | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True') | list | length) == 0))
             else []) }}
      loop: "{{ pod_final_status.resources | default([]) }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      when: inventory_hostname in groups['master_nodes']

    - name: fail loudly when pods are still not Ready after restart
      ansible.builtin.fail:
        msg: >-
          The following aether-5gc pods did not become Ready after being
          restarted by the rescue block:
          {{ pod_still_not_ready_names | default([]) | join(', ') }}.
      when:
        - inventory_hostname in groups['master_nodes']
        - (pod_still_not_ready_names | default([]) | length) > 0
