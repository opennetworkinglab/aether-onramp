core:
  values_file: "roles/core/templates/sdcore-5g-values.yaml"

  helm:
    local_charts: false
    chart_ref: oci://ghcr.io/omec-project/sd-core
    chart_version: 6.1.2 # Ignored if using local charts (local_charts: true)

  # MongoDB and Kafka run from their community operators (see
  # templates/sdcore-5g-values.yaml); tasks/install.yml installs the operators,
  # so their Helm settings live here rather than in that template.
  mongodb:
    # MongoDB Controllers for Kubernetes (MCK), the operator and CRDs that
    # 5g-control-plane's mongodbCommunity path requires in the cluster before
    # the sd-core chart is installed. Every member needs a PersistentVolume,
    # so install.yml provisions local-path-provisioner as the default
    # StorageClass when the cluster has none.
    operator:
      helm:
        chart_ref: mongodb/mongodb-kubernetes
        chart_version: ""   # empty = latest
      # local-path-provisioner version used to supply a default StorageClass
      # when none exists. Mirrors deps/sdran/vars/default.yml's
      # sdran.platform.store.lpp.version.
      lpp:
        version: v0.0.24

  kafka:
    # Strimzi Kafka operator and CRDs that 5g-control-plane's kafka
    # path requires in the cluster before the sd-core chart is installed.
    operator:
      helm:
        repo_url: https://strimzi.io/charts/
        chart_ref: strimzi/strimzi-kafka-operator
        chart_version: "1.3.0"
