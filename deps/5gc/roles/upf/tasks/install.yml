---

# Interpret core.networks and core.upf.instances and check them against this
# host. Shared with the 5gc/core and 5gc/router roles via the preflight role,
# so additional UPFs are described exactly like the built-in one.
- name: resolve UPF networking
  import_role:
    name: preflight
    tasks_from: upf_networks.yml

# Every instance other than `default` (the built-in UPF, rendered into the
# sd-core release by 5gc/core) is deployed here as its own bess-upf release.
- name: list the additional UPF instances
  ansible.builtin.set_fact:
    additional_upfs: "{{ upf_instances | dict2items | rejectattr('value.builtin') | list }}"

# kubernetes.core modules used later in this role require the python
# `kubernetes` client library, which is NOT pulled in by a stock apt
# install of ansible on Ubuntu. Install it up-front.
- name: install kubernetes.core python prerequisite for 5gc/upf
  import_role:
    name: preflight
    tasks_from: python_kubernetes.yml

# Ensure ~/.kube/config exists for the ansible user so kubernetes.core
# tasks below find a valid config. See the 5gc/core role for the full
# rationale and for why we only act when the file is absent.
- name: bootstrap and verify kubeconfig for 5gc/upf install
  import_role:
    name: preflight
    tasks_from: bootstrap_kubeconfig.yml
  vars:
    kubeconfig_component_name: 5GC UPF install
    kubeconfig_help_text: >-
      Run the k8s provisioning flow first, or install 5GC core with a valid
      kubeconfig_source so the cluster context is bootstrapped.

# Validate SR-IOV UPF resource pools and VF MAC addresses for the additional
# UPFs. Shared with the built-in UPF install path (5gc/core) via the
# preflight role so both paths accept identical configuration and cannot
# drift. The task file checks each PF a dpdk UPF attaches through, and does
# nothing when no UPF is in dpdk mode.
- name: validate SR-IOV UPF resource pools for additional UPFs
  import_role:
    name: preflight
    tasks_from: sriov_upf_pools.yml

- name: remove /tmp/upf-[].yaml
  file:
    path: "/tmp/upf-{{ item.key }}.yaml"
    state: absent
  loop: "{{ additional_upfs }}"
  loop_control:
    label: "{{ item.key }}"
  when: inventory_hostname in groups['master_nodes']

- name: render the values file for each additional UPF
  template:
    src: "{{ ROOT_DIR }}/{{ core.upf.values_file }}"
    dest: /tmp/upf-{{ item.key }}.yaml
  vars:
    upf: "{{ item.value }}"
  loop: "{{ additional_upfs }}"
  loop_control:
    label: "{{ item.key }}"
  when: inventory_hostname in groups['master_nodes']

- name: update helm dependencies
  command:
    argv:
      - helm
      - dep
      - up
      - "{{ core.upf.helm.chart_ref }}"
  when: inventory_hostname in groups['master_nodes'] and core.upf.helm.local_charts

- set_fact:
    upf_helm_requires_repo_update: "{{ (not core.upf.helm.local_charts) and not (core.upf.helm.chart_ref is match('^oci://')) }}"
  when: inventory_hostname in groups['master_nodes']

# Each additional UPF's route and NAT live in a unit of its own, installed and
# removed with the release, so they persist across reboots and go away with the
# UPF. Only for UPFs whose core network this host is the gateway for. A unit
# already present is stopped first, so its ExecStop removes what the previous
# definition added before a changed pool or egress replaces it; units for
# UPFs that no longer need host routing (or are no longer configured) go.
- name: find the route and NAT units of previous installs
  find:
    paths: /etc/systemd/system
    patterns: "aether-upf-*-routes.service"
    file_type: file
  register: upf_route_units
  when: inventory_hostname in groups['master_nodes']
  become: true

- name: stop the route and NAT units of previous installs
  systemd:
    name: "{{ item.path | basename }}"
    state: stopped
  loop: "{{ upf_route_units.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: inventory_hostname in groups['master_nodes']
  become: true
  failed_when: false

- name: remove route and NAT units no additional UPF needs any more
  systemd:
    name: "{{ item.path | basename }}"
    enabled: false
    state: stopped
  loop: "{{ upf_route_units.files | default([]) | rejectattr('path', 'in', additional_upfs | selectattr('value.core.host_gateway') | map(attribute='key') | map('regex_replace', '^(.*)$', '/etc/systemd/system/aether-upf-\\1-routes.service') | list) | list }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: inventory_hostname in groups['master_nodes']
  become: true
  failed_when: false

- name: delete route and NAT units no additional UPF needs any more
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ upf_route_units.files | default([]) | rejectattr('path', 'in', additional_upfs | selectattr('value.core.host_gateway') | map(attribute='key') | map('regex_replace', '^(.*)$', '/etc/systemd/system/aether-upf-\\1-routes.service') | list) | list }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: inventory_hostname in groups['master_nodes']
  become: true

- name: install the UE pool route and NAT unit for each additional UPF
  template:
    src: roles/upf/templates/aether-upf-routes.service
    dest: /etc/systemd/system/aether-upf-{{ item.key }}-routes.service
  vars:
    upf: "{{ item.value }}"
    upf_egress: "{{ [ansible_default_ipv4.interface | default(''), upf_networks[item.value.core.network].parent] | reject('equalto', '') | unique | list }}"
  loop: "{{ additional_upfs | selectattr('value.core.host_gateway') | list }}"
  loop_control:
    label: "{{ item.key }}"
  when: inventory_hostname in groups['master_nodes']
  become: true

- name: enable and start each additional UPF's route and NAT unit
  systemd:
    name: aether-upf-{{ item.key }}-routes.service
    enabled: true
    state: restarted
    daemon_reload: true
  loop: "{{ additional_upfs | selectattr('value.core.host_gateway') | list }}"
  loop_control:
    label: "{{ item.key }}"
  when: inventory_hostname in groups['master_nodes']
  become: true

- name: deploy upf
  kubernetes.core.helm:
    update_repo_cache: "{{ upf_helm_requires_repo_update }}"
    name: bess-upf
    release_namespace: aether-upf-{{ item.key }}
    create_namespace: true
    chart_ref: "{{ core.upf.helm.chart_ref }}"
    chart_version: "{{ core.upf.helm.chart_version if core.upf.helm.local_charts == false else omit }}"
    values_files:
      - /tmp/upf-{{ item.key }}.yaml
    wait: true
    wait_timeout: "1m30s"
    force: true
  loop: "{{ additional_upfs }}"
  loop_control:
    label: "{{ item.key }}"
  when: inventory_hostname in groups['master_nodes']
