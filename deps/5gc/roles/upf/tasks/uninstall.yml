---

- name: delete route for upf to UE
  command:
    argv:
      - ip
      - route
      - del
      - "{{ item.value.ue_ip_pool }}"
      - via
      - "{{ item.value.ip.core }}"
  when: inventory_hostname in groups['master_nodes']
  with_dict: "{{ core.upf.additional_upfs}}"
  become: true
  ignore_errors: yes

- name: verify helm prerequisites for 5gc/upf uninstall
  import_role:
    name: preflight
    tasks_from: helm.yml

- name: verify kubeconfig prerequisites for 5gc/upf uninstall
  import_role:
    name: preflight
    tasks_from: kubeconfig.yml
  vars:
    kubeconfig_component_name: 5GC UPF
    kubeconfig_help_text: >-
      Run the k8s provisioning flow first, or install 5GC core with a valid
      kubeconfig_source so the cluster context is bootstrapped.

- name: remove aether upfs
  kubernetes.core.helm:
    name: bess-upf
    release_namespace: aether-upf-{{ item.key }}
    state: absent
    wait: true
  with_dict: "{{ core.upf.additional_upfs}}"
  when: inventory_hostname in groups['master_nodes']
  ignore_errors: yes

- name: delete namespace aether-upf
  command:
    argv:
      - kubectl
      - delete
      - namespace
      - "aether-upf-{{ item.key }}"
  with_dict: "{{ core.upf.additional_upfs}}"
  when: inventory_hostname in groups['master_nodes']
  ignore_errors: yes

