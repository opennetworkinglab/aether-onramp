# Override values for omec-user-plane Helm Chart
# https://github.com/omec-project/sdcore-helm-charts/blob/main/bess-upf/values.yaml
enable: true
resources:
  enabled: false
# images:
#   repository: ""
#   tags:
#     bess: <bess image tag>
#     pfcpiface: <pfcp image tag>
#     tools: <aether-pod-init image tag>
config:
  upf:
    name: "aether-upf"
    sriov:
      enabled: {{ (upf.mode == 'dpdk') | ternary('true', 'false') }}
    hugepage:
      enabled: {{ (upf.mode == 'dpdk') | ternary('true', 'false') }}
    routes:
      - to: {{ ansible_default_ipv4.address }}
        via: 169.254.1.1
    ran:
      subnet: {{ upf.access.ran_subnet }} # Subnet for the gNB network
    access:
      ipam: static
      cniPlugin: {{ upf.access.cni }}
{% if upf.mode == 'dpdk' %}
      resourceName: {{ upf.access.resource_name | to_json }}
{% endif %}
      iface: {{ upf.access.iface }}
      gateway: {{ upf.access.gateway }}
      ip: {{ upf.access.ip_cidr }}
    core:
      ipam: static
      cniPlugin: {{ upf.core.cni }}
{% if upf.mode == 'dpdk' %}
      resourceName: {{ upf.core.resource_name | to_json }}
{% endif %}
      iface: {{ upf.core.iface }}
      gateway: {{ upf.core.gateway }}
      ip: {{ upf.core.ip_cidr }}
    closedLoop: {{ core.closed_loop | default('false') | lower }}
    cfgFiles:
      upf.jsonc:
        mode: {{ upf.mode }}
        hwcksum: true
        log_level: "info"
        measure_upf: true
        measure_flow: true
        gtppsc: true        # Extension header enabled in 5G.
        # DDP is INTEL NIC's specific feature (supported in E810 series)
        # which helps to improve UPF packet processing performance.
        # For more details on DDP feature and its usage please refer
        # "https://www.intel.com/content/www/us/en/download/19660/intel-ethernet-800-series-dynamic-device-personalization-ddp-for-telecommunication-comms-package.html"
        ddp: false          # this parameter is only used/relevant when deploying the UPF in 'dpdk' mode
        cpiface:
          hostname: "upf"
          #http_port: "8080"
          enable_ue_ip_alloc: true    # If true, UPF allocates address from following pool
          ue_ip_pool: {{ upf.ue_ip_pool }} # IP pool used UEs if enable_ue_ip_alloc=true
        slice_rate_limit_config:       # Slice-level rate limiting
          # Uplink
          n6_bps: 10000000000          # 10Gbps
          n6_burst_bytes: 12500000     # 10ms * 10Gbps
          # Downlink
          n3_bps: 10000000000          # 10Gbps
          n3_burst_bytes: 12500000     # 10ms * 10Gbps
