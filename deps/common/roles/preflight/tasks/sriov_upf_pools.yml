---

# Shared SR-IOV UPF resource-pool preflight for dpdk UPFs. Imported by the
# 5gc/core (built-in UPF) and 5gc/upf (additional UPFs) roles after
# upf_networks.yml, so both paths validate identical configuration and cannot
# drift. A dpdk UPF has both sides on one PF (the resolver enforces it), so
# each distinct PF is checked once, with the pool names its UPFs use.
- name: list the SR-IOV PFs the dpdk UPFs attach through
  ansible.builtin.set_fact:
    sriov_pools: >-
      {%- set pools = [] -%}
      {%- for u in upf_instances.values() if u.mode == 'dpdk' -%}
      {%- set pool = {'iface': u.access.iface, 'access_rn': u.access.resource_name, 'core_rn': u.core.resource_name} -%}
      {%- if pool not in pools %}{% set _ = pools.append(pool) %}{% endif -%}
      {%- endfor -%}
      {{ pools }}
  when: inventory_hostname in groups['master_nodes']

- name: validate SR-IOV resource pools and VFs on each PF
  ansible.builtin.include_tasks: sriov_upf_pool.yml
  vars:
    sriov_pool: "{{ item }}"
  loop: "{{ sriov_pools | default([]) }}"
  loop_control:
    label: "{{ item.iface }}"
  when: inventory_hostname in groups['master_nodes']
