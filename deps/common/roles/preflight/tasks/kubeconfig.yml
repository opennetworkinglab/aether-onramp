---

- name: check for ansible-user kubeconfig before kubernetes tasks
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.kube/config"
  register: kubeconfig_stat
  when: inventory_hostname in groups['master_nodes']
  tags:
    - always

- name: fail when ansible-user kubeconfig is unavailable
  ansible.builtin.fail:
    msg: >-
      A readable kubeconfig file is required on {{ inventory_hostname }}
      before running {{ kubeconfig_component_name | default('5GC') }} tasks
      that talk to the cluster. Expected {{ ansible_env.HOME }}/.kube/config
      for ansible_user {{ ansible_user }}. {{ kubeconfig_help_text |
      default('Run the k8s provisioning flow first, or set kubeconfig_source and rerun the install path that bootstraps it.') }}
  when:
    - inventory_hostname in groups['master_nodes']
    - not (kubeconfig_stat.stat.exists | default(false)) or not (kubeconfig_stat.stat.readable | default(false)) or not ((kubeconfig_stat.stat.isreg | default(false)) or (kubeconfig_stat.stat.islnk | default(false)))
  tags:
    - always

- name: verify ansible-user kubeconfig can reach the kubernetes api
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ ansible_env.HOME }}/.kube/config"
      - --request-timeout=10s
      - version
  register: kubeconfig_api_probe
  changed_when: false
  failed_when: false
  when:
    - inventory_hostname in groups['master_nodes']
    - kubeconfig_stat.stat.exists | default(false)
    - kubeconfig_stat.stat.readable | default(false)
    - (kubeconfig_stat.stat.isreg | default(false)) or (kubeconfig_stat.stat.islnk | default(false))
  tags:
    - always

- name: fail when ansible-user kubeconfig cannot reach the kubernetes api
  ansible.builtin.fail:
    msg: >-
      The kubeconfig at {{ ansible_env.HOME }}/.kube/config for ansible_user
      {{ ansible_user }} exists, but it cannot complete a kubectl API probe on
      {{ inventory_hostname }} before running
      {{ kubeconfig_component_name | default('5GC') }} tasks. rc={{
      kubeconfig_api_probe.rc | default('unknown') }} stderr={{
      kubeconfig_api_probe.stderr | default('') | trim }} stdout={{
      kubeconfig_api_probe.stdout | default('') | trim }}.
      {{ kubeconfig_help_text |
      default('Run the k8s provisioning flow first, or set kubeconfig_source and rerun the install path that bootstraps it.') }}
  when:
    - inventory_hostname in groups['master_nodes']
    - kubeconfig_api_probe.rc != 0
  tags:
    - always
