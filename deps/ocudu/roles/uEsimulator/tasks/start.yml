---

# The UPF's subnets and gateways come from the shared resolver (see
# deps/common/roles/preflight/tasks/upf_networks.yml) so this role and the
# 5gc roles read one description of the UPF's networking.
- name: resolve UPF networking
  import_role:
    name: preflight
    tasks_from: upf_networks.yml
  vars:
    upf_networks_strict: false

- name: check if servers and config server length are equal
  fail:
    msg: "Mismatch in number of servers and ocudu nodes: {{ ocudu.servers|length }} vs {{ groups['ocudu_nodes']|length }}"
  when: ocudu.servers|length != groups['ocudu_nodes']|length

- name: check if simulation is enabled else abort
  fail:
    msg: "Simulation is not enabled"
  when: ocudu.simulation == false

- name: ensure {{ ocudu.docker.container.ue_image }} image is present
  # `source: local` reuses the image staged into Docker by the
  # bundle's dockerimages step. Online installs still pull so
  # operators can refresh tags out-of-band.
  community.docker.docker_image:
    name: "{{ ocudu.docker.container.ue_image }}"
    source: "{{ 'local' if airgapped.enabled | default(false) | bool else 'pull' }}"
  when: inventory_hostname in groups['ocudu_nodes']
  become: true

# Rendered configs live under /var/lib so they survive a reboot. /tmp is a
# tmpfs on many hosts and is cleared by systemd-tmpfiles after 10 days on the
# rest; a container with restart_policy: unless-stopped then restarts with
# Docker having created an empty directory where its config file should be,
# and the gNB fails to parse it in a loop. /var/lib is also root-owned rather
# than world-writable 1777, so a privileged container no longer takes its
# configuration from a directory every local user can write to. Under the old
# layout that was safe only by virtue of /tmp's sticky bit and the template
# module's default of not following symlinks, neither of which this role
# states as a requirement. The render also sets an explicit root:root 0644
# instead of leaving the mode to the remote user's umask.
- name: create OCUDU runtime directories
  file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: /var/lib/ocudu, mode: '0755' }
    - { path: /var/lib/ocudu/conf, mode: '0755' }
    - { path: /var/lib/ocudu/pcap, mode: '0750' }
  when: inventory_hostname in groups['ocudu_nodes']
  become: true

- name: render UE config to /var/lib/ocudu/conf/ue_zmq.conf
  template:
    src: "{{ ocudu.servers[server_index | int].ue_conf }}"
    dest: /var/lib/ocudu/conf/ue_zmq.conf
    owner: root
    group: root
    mode: '0644'
  register: ocudu_ue_config
  vars:
    server_index: "{{ groups['ocudu_nodes'].index(inventory_hostname) }}"
  when: inventory_hostname in groups['ocudu_nodes']
  become: true

- name: create {{ ocudu.docker.container.ue_image }} containers
  community.docker.docker_container:
    name: "rfsim5g-nr-ue"
    image: "{{ ocudu.docker.container.ue_image }}"
    networks:
      - name: "{{ ocudu.docker.network.name }}"
    volumes:
      # the image expects the file at this path, so the host side moves but
      # the container side does not
      - /var/lib/ocudu/conf/ue_zmq.conf:/opt/ue_zmq.conf
      - /var/lib/ocudu/pcap:/var/log/ocudu
    devices:
      - /dev/net/tun:/dev/net/tun
    privileged: true
    capabilities:
    - NET_ADMIN
    - NET_RAW
    # A re-render does not reach an already running container, and the
    # module leaves an otherwise unchanged container alone, so bounce it
    # exactly when the rendered config changed.
    restart: "{{ ocudu_ue_config is changed }}"
    restart_policy: unless-stopped
    state: started
    detach: true
  when: inventory_hostname in groups['ocudu_nodes']
  become: true

- name: wait for UE tunnel interface
  community.docker.docker_container_exec:
    container: rfsim5g-nr-ue
    command: "ip netns exec ue1 ip link show tun_srsue"
  register: ocudu_ue_tunnel
  retries: 60
  delay: 2
  until: ocudu_ue_tunnel.rc == 0
  changed_when: false
  when: inventory_hostname in groups['ocudu_nodes']
  become: true

- name: add default route for UE
  community.docker.docker_container_exec:
    container: rfsim5g-nr-ue
    command: >-
      ip netns exec ue1 ip route replace default via
      {{ (upf_instances.default.ue_ip_pool.split('.'))[:3] | join('.') }}.{{ (upf_instances.default.ue_ip_pool.split('.')[3] | int) + 1 }}
      dev tun_srsue
  when: inventory_hostname in groups['ocudu_nodes']
  become: true

- set_fact:
    ping_target: "{{ upf_instances.default.core.gateway }}"
  when: inventory_hostname in groups['ocudu_nodes']

- name: run ping command to check if the UE is running and show output
  community.docker.docker_container_exec:
    container: rfsim5g-nr-ue
    command: "ip netns exec ue1 ping -c 5 {{ ping_target }}"
  register: uEsimPingOutput
  changed_when: false
  when: inventory_hostname in groups['ocudu_nodes']
  become: true

- debug:
    var: uEsimPingOutput.stdout_lines
  when: inventory_hostname in groups['ocudu_nodes']
