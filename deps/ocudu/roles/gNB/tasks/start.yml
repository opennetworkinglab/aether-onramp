---

- name: check if servers and config server length are equal
  fail:
    msg: "Mismatch in number of servers and ocudu nodes: {{ ocudu.servers|length }} vs {{ groups['ocudu_nodes']|length }}"
  when: ocudu.servers|length != groups['ocudu_nodes']|length

- name: Preflight | Docker CPU availability for O-CU/DU gNB
  ansible.builtin.include_role:
    name: preflight
    tasks_from: docker_cpu
  vars:
    preflight_label: "O-CU/DU gNB"
    preflight_min_cpus: "{{ ocudu.docker.preflight.min_cpus }}"
    preflight_probe_image: "{{ ocudu.docker.preflight.probe_image }}"
    preflight_enabled: "{{ ocudu.docker.preflight.enabled }}"
  when: inventory_hostname in groups['ocudu_nodes']

- name: enforce DPDK readiness before gNB start
  ansible.builtin.include_role:
    name: dpdk
    tasks_from: status
  vars:
    ocudu_dpdk_enforce_ready: true
  when: inventory_hostname in groups['ocudu_nodes']

- name: set net.core.wmem_max to 24912805
  ansible.posix.sysctl:
    name: net.core.wmem_max
    value: '24912805'
    sysctl_set: true
    reload: true
  when: inventory_hostname in groups['ocudu_nodes']
  become: true

- name: set net.core.rmem_max to 24912805
  ansible.posix.sysctl:
    name: net.core.rmem_max
    value: '24912805'
    sysctl_set: true
    reload: true
  when: inventory_hostname in groups['ocudu_nodes']
  become: true

- name: ensure {{ ocudu.docker.container.gnb_image }} image is present
  # In airgap mode the image is loaded into Docker by the bundle's
  # dockerimages step; `source: local` reuses that without
  # contacting a registry. Online installs keep the network pull
  # so operators can refresh tags out-of-band.
  community.docker.docker_image:
    name: "{{ ocudu.docker.container.gnb_image }}"
    source: "{{ 'local' if airgapped.enabled | default(false) | bool else 'pull' }}"
  when: inventory_hostname in groups['ocudu_nodes']
  become: true

# Rendered configs live under /var/lib so they survive a reboot. /tmp is a
# tmpfs on many hosts and is cleared by systemd-tmpfiles after 10 days on the
# rest; a container with restart_policy: unless-stopped then restarts with
# Docker having created an empty directory where its config file should be,
# and the gNB fails to parse it in a loop. /var/lib is also root-owned rather
# than world-writable 1777, so a privileged container no longer takes its
# configuration from a directory every local user can write to. Under the old
# layout that was safe only by virtue of /tmp's sticky bit and the template
# module's default of not following symlinks, neither of which this role
# states as a requirement. The render also sets an explicit root:root 0644
# instead of leaving the mode to the remote user's umask.
- name: create OCUDU runtime directories
  file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: /var/lib/ocudu, mode: '0755' }
    - { path: /var/lib/ocudu/conf, mode: '0755' }
    - { path: /var/lib/ocudu/pcap, mode: '0750' }
  when: inventory_hostname in groups['ocudu_nodes']
  become: true

- name: resolve per-host OCUDU gNB settings
  ansible.builtin.set_fact:
    server_index: "{{ groups['ocudu_nodes'].index(inventory_hostname) }}"
    server_dpdk: "{{ ocudu.servers[groups['ocudu_nodes'].index(inventory_hostname) | int].dpdk | default({}) }}"
  when: inventory_hostname in groups['ocudu_nodes']

- name: resolve derived DPDK startup settings
  ansible.builtin.set_fact:
    server_dpdk_enabled: "{{ (server_dpdk.enabled | default((ocudu.dpdk | default({})).enabled | default(false))) | bool }}"
    isolated_cpus: "{{ server_dpdk.isolated_cpus | default(((ocudu.dpdk | default({})).isolated_cpus | default('3-23')), true) }}"
  when: inventory_hostname in groups['ocudu_nodes']

- name: compute OFH and DU-High CPU pinning from isolated range
  ansible.builtin.set_fact:
    ofh_timing_cpu: "{{ cpu_pin_override.ofh_timing_cpu | default(isolated_cpus.split('-')[0]) }}"
    ofh_txrx_cpu: "{{ cpu_pin_override.ofh_txrx_cpu | default(isolated_cpus.split('-')[0] | int + 1) }}"
    du_high_cpus: "{{ cpu_pin_override.du_high_cpus | default((isolated_cpus.split('-')[0] | int + 2) ~ '-' ~ isolated_cpus.split('-')[-1]) }}"
    pinned_cpuset: "{{ isolated_cpus }}"
  vars:
    cpu_pin_override: "{{ server_dpdk.cpu_pinning | default((ocudu.dpdk | default({})).cpu_pinning | default({})) }}"
  when:
    - inventory_hostname in groups['ocudu_nodes']
    - server_dpdk_enabled
    - (isolated_cpus.split('-') | length) == 2
    - (isolated_cpus.split('-')[-1] | int) - (isolated_cpus.split('-')[0] | int) >= 3

- name: discover VF identifiers for DPDK gNB start
  ansible.builtin.include_role:
    name: dpdk
    tasks_from: resolve_dpdk_vf
  vars:
    ocudu_dpdk_caller: ocudu-gnb-start
  when:
    - inventory_hostname in groups['ocudu_nodes']
    - server_dpdk_enabled

- name: render gNB config to /var/lib/ocudu/conf/gnb_config.yaml
  template:
    src: "{{ ocudu.servers[server_index | int].gnb_conf }}"
    dest: /var/lib/ocudu/conf/gnb_config.yaml
    owner: root
    group: root
    mode: '0644'
  register: ocudu_gnb_config
  vars:
    gnb_ip: "{{ ocudu.servers[server_index | int].gnb_ip }}"
    gnb_id: "{{ (groups['ocudu_nodes'].index(inventory_hostname) | int) + 1000 }}"
    enable_e2_agent: "{{ (ocudu.servers[server_index | int].e2_agent.enable | default(false)) | bool | string | lower }}"
  when: inventory_hostname in groups['ocudu_nodes']
  become: true

- name: create {{ ocudu.docker.container.gnb_image }} containers
  community.docker.docker_container:
    name: ocudu-gnb
    image: "{{ ocudu.docker.container.gnb_image }}"
    networks:
      - name: "{{ ocudu.docker.network.name }}"
    volumes:
      # the config directory, read-only: srsRAN only ever reads it, and a
      # directory mount keeps a missing file reporting as a missing file
      - /var/lib/ocudu/conf:/etc/ocudu:ro
      - /var/lib/ocudu/pcap:/var/log/ocudu
      - /dev/hugepages:/dev/hugepages
      - /dev/bus/usb:/dev/bus/usb
    devices:
      - /dev/vfio:/dev/vfio
    cpuset_cpus: "{{ isolated_cpus if server_dpdk_enabled else omit }}"
    capabilities:
      - SYS_NICE
      - IPC_LOCK
    privileged: true
    # A re-render does not reach an already running container, and the
    # module leaves an otherwise unchanged container alone, so bounce it
    # exactly when the rendered config changed.
    restart: "{{ ocudu_gnb_config is changed }}"
    restart_policy: unless-stopped
    state: started
    detach: true
    interactive: false
    tty: false
    command: "{{ 'chrt -f 90 gnb -c /etc/ocudu/gnb_config.yaml' if server_dpdk_enabled else 'gnb -c /etc/ocudu/gnb_config.yaml' }}"
  when: inventory_hostname in groups['ocudu_nodes']
  become: true
