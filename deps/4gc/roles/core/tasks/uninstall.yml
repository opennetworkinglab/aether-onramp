---

- name: verify helm prerequisites for 4gc/core uninstall
  import_role:
    name: preflight
    tasks_from: helm.yml

- name: verify kubeconfig prerequisites for 4gc/core uninstall
  import_role:
    name: preflight
    tasks_from: kubeconfig.yml
  vars:
    kubeconfig_component_name: 4GC core
    kubeconfig_help_text: >-
      Run the k8s provisioning flow first, or set kubeconfig_source and rerun
      the install path that bootstraps it.

- name: remove aether 4gc
  kubernetes.core.helm:
    name: sd-core
    release_namespace: omec
    state: absent
    wait: true
  when: inventory_hostname in groups['master_nodes']
  ignore_errors: yes

- name: remove onosproject chart repo
  kubernetes.core.helm_repository:
    name: onosproject
    state: absent
    repo_url: "https://charts.onosproject.org"
  when: inventory_hostname in groups['master_nodes']
  ignore_errors: yes

- name: waiting for aether pods to terminate
  command:
    argv:
      - kubectl
      - wait
      - -n
      - omec
      - --for=delete
      - --all=true
      - -l
      - app!=ue
      - pod
      - --timeout=180s
  when: inventory_hostname in groups['master_nodes']
  ignore_errors: yes

- name: delete namespace omec
  command:
    argv:
      - kubectl
      - delete
      - namespace
      - omec
  when: inventory_hostname in groups['master_nodes']
  ignore_errors: yes

