---

- name: install kubernetes.core python prerequisite for 4gc/core
  import_role:
    name: preflight
    tasks_from: python_kubernetes.yml

# Interpret core.networks and core.upf.instances and check them against this
# host. The same resolver the 5gc roles use, so the UPF is described one way
# for both cores (aether-4gc-install runs 5gc-router-install for the host side).
- name: resolve UPF networking
  import_role:
    name: preflight
    tasks_from: upf_networks.yml

# The 4G values template renders an af_packet UPF only; SR-IOV, hugepages and
# the dpdk datapath are not wired for it.
- name: refuse a dpdk UPF for the 4G core
  ansible.builtin.fail:
    msg: >-
      core.upf.instances.default.mode is dpdk, which the 4G core does not
      support: its values template renders an af_packet UPF only. Set
      core.upf.mode (or the instance's mode) to af_packet.
  when:
    - inventory_hostname in groups['master_nodes']
    - upf_instances.default.mode == 'dpdk'

- name: remove /tmp/sdcore-4g-values.yaml
  file:
    path: "/tmp/sdcore-4g-values.yaml"
    state: absent
  when: inventory_hostname in groups['master_nodes']

- name: copy {{ ROOT_DIR }}/{{ core.values_file }} to /tmp/sdcore-4g-values.yaml
  template:
    src: "{{ ROOT_DIR }}/{{ core.values_file }}"
    dest: "/tmp/sdcore-4g-values.yaml"
  vars:
    upf: "{{ upf_instances.default }}"
  when: inventory_hostname in groups['master_nodes']

- set_fact:
    core_helm_requires_repo_update: "{{ not (core.helm.chart_ref is match('^oci://')) }}"
  when: inventory_hostname in groups['master_nodes']

# - name: update aether 5gc helm dependencies
#   shell: |
#     helm dep up "{{ core.helm.chart_ref }}"
#   when: inventory_hostname in groups['master_nodes']

# TODO: add systems check to avoid issues (e.g., mongodb needing avx support)
- name: deploy aether 4gc
  block:
    - name: deploy aether 4gc
      kubernetes.core.helm:
        update_repo_cache: "{{ core_helm_requires_repo_update }}"
        name: sd-core
        release_namespace: omec
        create_namespace: true
        chart_ref: "{{ core.helm.chart_ref }}"
        chart_version: "{{ core.helm.chart_version }}"
        values_files:
          - /tmp/sdcore-4g-values.yaml
        wait: true
        wait_timeout: "1m30s"
        force: true
      when: inventory_hostname in groups['master_nodes']

  rescue:
    - name: Get Pods Status
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: omec
      register: pod_status
      changed_when: false
      when: inventory_hostname in groups['master_nodes']

    - name: restart Pods if not running
      kubernetes.core.k8s:
        api_version: v1
        kind: Pod
        namespace: omec
        name: "{{ item.metadata.name }}"
        state: absent
      loop: "{{ pod_status.resources | default([]) }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      register: pod_restart
      when:
        - inventory_hostname in groups['master_nodes']
        - (item.status.phase | default('')) != 'Running'
      ignore_errors: yes
  always:
    - pause:
        seconds: 180
