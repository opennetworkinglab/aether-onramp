---

# The UPF's subnets and gateways come from the shared resolver (see
# deps/common/roles/preflight/tasks/upf_networks.yml) so this role and the
# 5gc roles read one description of the UPF's networking.
- name: resolve UPF networking
  import_role:
    name: preflight
    tasks_from: upf_networks.yml
  vars:
    upf_networks_strict: false

- name: check if servers and config server length are equal
  fail:
    msg: "Mismatch in number of servers and n3iwf nodes: {{ n3iwf.servers|length }} vs {{ groups['n3iwf_nodes']|length }}"
  when: n3iwf.servers|length != groups['n3iwf_nodes']|length

- name: check if static route exists for {{ upf_instances.default.access.subnet }} via {{ core.amf.ip }}
  command:
    argv:
      - ip
      - route
      - show
      - "{{ upf_instances.default.access.subnet }}"
      - via
      - "{{ core.amf.ip }}"
  register: route_check
  changed_when: false
  failed_when: false
  when:
    - (inventory_hostname in groups['n3iwf_nodes'])
    - (inventory_hostname not in groups['master_nodes'])
    - upf_instances.default.access.host_gateway
  become: true

- name: remove a static route on n3iwf host for {{ upf_instances.default.access.subnet }} via {{ core.amf.ip }}
  command:
    argv:
      - ip
      - route
      - del
      - "{{ upf_instances.default.access.subnet }}"
      - via
      - "{{ core.amf.ip }}"
  when:
    - (inventory_hostname in groups['n3iwf_nodes'])
    - (inventory_hostname not in groups['master_nodes'])
    - upf_instances.default.access.host_gateway
    - route_check.stdout != ""
  become: true

- name: set net.ipv4.conf.all.arp_filter to 0
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.arp_filter
    value: '0'
    sysctl_set: true
    reload: true
  when: (inventory_hostname in groups['n3iwf_nodes']) and (inventory_hostname not in groups['master_nodes'])
  become: true

- name: set net.ipv4.conf.all.arp_ignore to 0
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.arp_ignore
    value: '0'
    sysctl_set: true
    reload: true
  when: (inventory_hostname in groups['n3iwf_nodes']) and (inventory_hostname not in groups['master_nodes'])
  become: true

- name: set net.ipv4.conf.all.arp_announce to 0
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.arp_announce
    value: '0'
    sysctl_set: true
    reload: true
  when: (inventory_hostname in groups['n3iwf_nodes']) and (inventory_hostname not in groups['master_nodes'])
  become: true

- name: set net.ipv4.conf.all.rp_filter to 2
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.rp_filter
    value: '2'
    sysctl_set: true
    reload: true
  when: (inventory_hostname in groups['n3iwf_nodes']) and (inventory_hostname not in groups['master_nodes'])
  become: true

- name: force systemd to reread configs
  systemd:
    daemon_reload: true
  when: inventory_hostname in groups['n3iwf_nodes']
  become: true

- name: restart systemd-networkd
  systemd:
    name: systemd-networkd
    state: restarted
  when: inventory_hostname in groups['n3iwf_nodes']
  become: true
