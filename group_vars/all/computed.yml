---
# Computed variables derived from user configuration.
# Ansible automatically loads every file under group_vars/all/ that has no
# extension or a .yml/.yaml/.json extension, for every host (e.g. this file,
# plus vault.yml once you create it from vault.yml.example). Files with other
# suffixes, such as vault.yml.example, are not loaded.

proxy_env: >-
  {{
    {
      'http_proxy':  proxy.http_proxy,
      'https_proxy': proxy.https_proxy,
      'HTTP_PROXY':  proxy.http_proxy,
      'HTTPS_PROXY': proxy.https_proxy,
      'no_proxy':    proxy.no_proxy,
      'NO_PROXY':    proxy.no_proxy
    }
    if (proxy is defined and proxy.enabled | default(false))
    else {}
  }}
