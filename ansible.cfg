[ssh_connection]
ssh_args = "-o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o ControlMaster=auto -o ControlPersist=5m -o LogLevel=QUIET -o ForwardAgent=yes"
control_path = /tmp/ansible-%%r@%%h:%%p

[defaults]
forks = 48
pipelining = True
host_key_checking = False
deprecation_warnings = False
hash_behaviour = merge
interpreter_python = auto_silent
roles_path = ./deps/common/roles
# Uncomment after adopting vault-based credentials (see
# group_vars/all/vault.yml.example). The referenced file must exist and hold
# the password used to encrypt group_vars/all/vault.yml; otherwise every
# Ansible run fails while trying to read it. Because it stores the plaintext
# vault password, restrict it to owner-only access (chmod 600).
# vault_password_file = ~/.ansible_vault_pass
