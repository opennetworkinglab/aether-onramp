apiVersion: onramp.aetherproject.org/v1
kind: Component
name: amp
description: Aether Monitoring Platform
repo_url: https://github.com/opennetworkinglab/aether-onramp
docs_url: https://docs.aetherproject.org/onramp/start.html
status: active
ui_visible: true
group: platform
vars_key: amp
install_tier: 2
actions:
  - name: install
    description: Deploy AMP
    target: aether-amp-install
    lifecycle: install
  - name: uninstall
    description: Remove AMP
    target: aether-amp-uninstall
    lifecycle: uninstall
dependencies:
  requires: [k8s]
  required_by: []
probe:
  type: helm_release
  namespace: cattle-monitoring-system
schema:
  type: object
  properties:
    monitor_dashboard:
      type: string
      description: Path to the monitoring dashboard bundle
    monitor:
      type: object
      properties:
        helm:
          type: object
          properties:
            chart_ref:
              type: string
              description: Chart registry reference or local chart path
            chart_version:
              type: string
              description: Chart version constraint
    monitor_crd:
      type: object
      properties:
        helm:
          type: object
          properties:
            chart_ref:
              type: string
              description: Chart registry reference or local chart path
            chart_version:
              type: string
              description: Chart version constraint

defaults:
  monitor_dashboard: "deps/amp/roles/monitor-load/templates/5g-monitoring"
  monitor:
    helm:
      chart_ref: rancher/rancher-monitoring
      chart_version: 110.0.1+up80.9.1-rancher.19
  monitor_crd:
    helm:
      chart_ref: rancher/rancher-monitoring-crd
      chart_version: 110.0.1+up80.9.1-rancher.19

