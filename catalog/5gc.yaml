apiVersion: onramp.aetherproject.org/v1
kind: Component
name: 5gc
description: 5G core network (SD-Core)
repo_url: https://github.com/opennetworkinglab/aether-onramp
docs_url: https://docs.aetherproject.org/onramp/start.html
status: active
ui_visible: true
group: core
vars_key: core
install_tier: 1
actions:
  - name: install
    description: Deploy 5G core
    target: aether-5gc-install
    lifecycle: install
  - name: uninstall
    description: Remove 5G core
    target: aether-5gc-uninstall
    lifecycle: uninstall
  - name: reset
    description: Reset 5G core state
    target: aether-5gc-reset
    lifecycle: reset
dependencies:
  requires: [k8s]
  required_by: [gnbsim, ueransim, oai, srsran, ocudu, n3iwf]
probe:
  type: namespace_pods
  namespace: aether-5gc
schema:
  type: object
  properties:
    closed_loop:
      type: boolean
      description: Enable SD-Core closed-loop control plane behavior
    data_iface:
      type: string
      description: Data-plane network interface used for UPF traffic
    values_file:
      type: string
      description: Helm values file path for the core deployment
    ran_subnet:
      type: string
      description: RAN-side subnet in CIDR notation
    helm:
      type: object
      description: Helm chart reference for SD-Core
      properties:
        local_charts:
          type: boolean
          description: Use local charts instead of fetching from a registry
        chart_ref:
          type: string
          description: Chart registry reference or local chart path
        chart_version:
          type: string
          description: Chart version constraint
    upf:
      type: object
      description: User Plane Function configuration
      properties:
        access_subnet:
          type: string
          description: Access subnet and gateway for the N3 side
        core_subnet:
          type: string
          description: Core subnet and gateway for the N6 side
        mode:
          type: string
          description: UPF operating mode
          enum: [af_packet, dpdk]
        access_resource_name:
          type: string
          description: SR-IOV resource pool name for the access (N3) interface in DPDK mode
          # Fully-qualified Kubernetes extended resource name 'prefix/name':
          # prefix is a DNS-1123 subdomain (1-244 chars, neither under
          # kubernetes.io nor starting with the reserved 'requests.'), name
          # is a qualified name (1-63 chars). The 244 bound is 253 (DNS-1123
          # subdomain max) minus len('requests.'), which IsExtendedResourceName
          # prepends before validating. The length bounds are encoded in the
          # pattern so this matches the install-time preflight exactly; no
          # separate maxLength is needed.
          pattern: "^(?!.*kubernetes\\.io/)(?!requests\\.)(?=[^/]{1,244}/)[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/[A-Za-z0-9]([-A-Za-z0-9_.]{0,61}[A-Za-z0-9])?$"
        core_resource_name:
          type: string
          description: SR-IOV resource pool name for the core (N6) interface in DPDK mode
          # See access_resource_name: same fully-qualified extended
          # resource-name constraint, with length bounds encoded in the pattern.
          pattern: "^(?!.*kubernetes\\.io/)(?!requests\\.)(?=[^/]{1,244}/)[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/[A-Za-z0-9]([-A-Za-z0-9_.]{0,61}[A-Za-z0-9])?$"
        multihop_gnb:
          type: boolean
          description: When true, the access subnet shares data_iface instead of using a separate RAN-facing interface
        helm:
          type: object
          description: Helm chart reference for the optional standalone UPF
          properties:
            local_charts:
              type: boolean
              description: Use local charts instead of fetching from a registry
            chart_ref:
              type: string
              description: Chart registry reference or local chart path
            chart_version:
              type: string
              description: Chart version constraint
        values_file:
          type: string
          description: Helm values file path for the UPF deployment
        default_upf:
          type: object
          description: Default UPF instance settings
          properties:
            ip:
              type: object
              properties:
                access:
                  type: string
                  description: UPF access-side IP
                core:
                  type: string
                  description: UPF core-side IP
            ue_ip_pool:
              type: string
              description: UE address pool in CIDR notation
        additional_upfs:
          type: object
          description: Additional UPFs keyed by identifier
          additionalProperties:
            type: object
            properties:
              ip:
                type: object
                properties:
                  access:
                    type: string
                    description: UPF access-side IP
                  core:
                    type: string
                    description: UPF core-side IP
              ue_ip_pool:
                type: string
                description: UE address pool in CIDR notation
    amf:
      type: object
      description: AMF connectivity settings
      properties:
        ip:
          type: string
          description: AMF N2 IP address

defaults:
  values_file: "deps/5gc/roles/core/templates/sdcore-5g-values.yaml"
  ran_subnet: ""
  helm:
    local_charts: false
    chart_ref: oci://ghcr.io/omec-project/sd-core
    chart_version: 5.0.0
  upf:
    access_subnet: "192.168.252.1/24"
    core_subnet: "192.168.250.1/24"
    mode: af_packet
    access_resource_name: "intel.com/intel_sriov_vfio_access"
    core_resource_name: "intel.com/intel_sriov_vfio_core"
    multihop_gnb: false

